[program:bbf-attested-proxy]
environment=PROC_NAME="%(program_name)s"
command=/venv/main/bin/python /workspace/bbf_attested_proxy.py --listen 127.0.0.1:18080 --upstream http://127.0.0.1:18000 --template-path /workspace/qwen36_input_role_chat_template.jinja
autostart=true
autorestart=unexpected
exitcodes=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
